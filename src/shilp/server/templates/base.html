<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}shilp{% endblock %} · shilp {{ version }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2410c'/%3E%3Cpath d='M9 22l7-12 7 12z' fill='%23fff7ed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/shilp.css?v={{ version }}">
  {# Loaded synchronously so the saved theme applies before first paint. #}
  <script src="/static/js/theme.js?v={{ version }}"></script>
  {% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="shilp home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="8"/><path d="M9 22l7-12 7 12z"/></svg>
      </span>
      <span class="brand-name">shilp</span>
      <span class="brand-version">v{{ version }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/" {% if page == 'status' %}aria-current="page"{% endif %}>Status</a>
      <a href="/chat" {% if page == 'chat' %}aria-current="page"{% endif %}>Chat</a>
      <a href="/docs">API docs</a>
    </nav>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle
            aria-label="Toggle colour theme" title="Toggle colour theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
